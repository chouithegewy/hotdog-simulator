# cbindgen's settings for include/kitchen_sim.h (tools/build-ffi.sh runs it). The header is C with C++ guards: plain
# structs, fixed-width integers, no Rust types.
language = "C"
cpp_compat = true
pragma_once = true
include_guard = "KITCHEN_SIM_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true
style = "both"
documentation = true
documentation_style = "c99"
line_length = 120
tab_width = 4
autogen_warning = "/* Generated by cbindgen from crates/kitchen-ffi/src by tools/build-ffi.sh. Do not edit by hand. */"
header = """
/*
 * kitchen_sim.h: the C interface to Hotdog Simulator's simulation (crates/kitchen-sim), for clients in other languages.
 * SPDX-License-Identifier: GPL-3.0-only. Copyright (C) 2026 David Nunes-Childs.
 *
 * The library is crates/kitchen-ffi: libkitchen_ffi.a (static) or libkitchen_ffi.so. See crates/kitchen-ffi/README.md.
 *
 * COORDINATES AND UNITS (the simulation's, exactly as it has them: the library converts nothing)
 *   - Metres, seconds, radians, kilograms, HP (0..100). Speeds in m/s.
 *   - Right-handed, Y up. The kitchen floor is y = 0; the counter top, where the game is played, is
 *     y = KsMapInfo::floor = 0.9025. Map rectangles are [min x, min z, max x, max z] on the counter; map heights are
 *     above the counter top (world y = floor + height). Positions the readers give (players' feet, props, rounds)
 *     are world space.
 *   - A hotdog with yaw Y faces (-sin Y, 0, -cos Y): yaw 0 looks along -Z, yaw +pi/2 along -X. Its rotation is the
 *     quaternion about +Y by Y. Pitch is up positive (-1.5..1.5): it looks along R_y(yaw) * R_x(pitch) * (0, 0, -1).
 *   - Quaternions are [x, y, z, w].
 *
 * CONVERTING TO UNREAL (centimetres, Z up, left-handed, X forward, Y right): do it in the client.
 *   UE.X = -100 * z      UE.Y = 100 * x      UE.Z = 100 * y          (positions and velocities; lengths times 100)
 *   UE yaw (degrees)   = -yaw * 180/pi       (a hotdog with sim yaw 0 faces UE +X)
 *   UE pitch (degrees) =  pitch * 180/pi
 *   UE quaternion FQuat(X, Y, Z, W) = ( qz, -qx, -qy, qw ) for a sim quaternion [qx, qy, qz, qw]
 *   (the basis change has determinant -1, so the rotation axis flips: axis' = -M * axis with M the map above).
 *   A map rectangle [x0, z0, x1, z1] covers UE X from -100*z1 to -100*z0 and UE Y from 100*x0 to 100*x1.
 *
 * ERRORS
 *   Every function that can fail returns a KsStatus; KS_OK is 0. On failure ks_last_error() says why (per thread).
 *   No Rust panic crosses into the caller: a panic is caught and returned as KS_ERR_PANIC (destroy that handle).
 *   Handles are checked against the live ones before use: null, destroyed or made-up handles are refused.
 *
 * LIFETIMES
 *   - A KsGame lives from ks_game_create / ks_client_create to ks_game_destroy. One handle must not be used by two
 *     threads at once; separate handles are independent.
 *   - Array readers copy into the caller's array: (array, capacity, &count) writes min(capacity, total) entries and
 *     sets count = total. Ask with capacity 0 first, or pass a generous array.
 *   - KsStr fields inside what a reader returns (names, styles, the alert...) point into the game and stay valid
 *     until the next call that changes it: ks_game_set_command, ks_game_step, ks_game_restart, ks_game_set_bot,
 *     ks_game_use_griddle, ks_game_ready, ks_cards_command, ks_game_set_tuning, ks_client_receive_*, ks_client_poll,
 *     ks_client_send_text, ks_client_set_prediction, ks_cards_json, ks_map_json, ks_game_events, ks_game_destroy.
 *     Copy what you keep.
 *   - Static strings (ks_version().version, ks_kungfu_move keys and names, ks_prop_kind_name, ks_sound_file,
 *     ks_weapon_name, ks_stage_name, ks_kungfu_style_name) live as long as the process.
 *   - ks_client_poll's bytes live until the next ks_client_poll or ks_game_destroy on that handle.
 *   - Strings are UTF-8, pointer plus length, not NUL-terminated (ks_last_error's is, as a convenience).
 *
 * A CLIENT'S FRAME
 *   Offline:  ks_game_set_command(game, &input);  ks_game_step(game, dt);
 *             read: ks_game_match, ks_game_players, ks_game_props, ks_game_projectiles, ks_kungfu_fighters ...;
 *             drain ks_game_events (play its sounds, spawn its effects).
 *   Online:   for each message from the server's WebSocket: ks_client_receive_binary / ks_client_receive_text;
 *             ks_game_set_command(game, &input);  ks_game_step(game, dt);
 *             read and drain events as offline;
 *             while (ks_client_poll(game, &msg) == KS_OK && msg.kind != KS_MESSAGE_NONE) send msg as text or binary.
 *   When KsMatch::map_generation changes (online: a welcome or a new map), read the static map again (ks_map_*).
 */
"""

[export]
include = ["KsEvent", "KsMessage", "KsJoin", "KsClientStatus"]
prefix = ""

[export.rename]

[enum]
rename_variants = "None"
prefix_with_name = false

[fn]
args = "auto"
sort_by = "None"

[struct]
derive_constructor = false

[parse]
parse_deps = false
clean = false

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"
