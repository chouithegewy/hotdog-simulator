# Settings for cargo-about (tools/build-licenses.sh, which makes THIRD_PARTY_LICENSES.html from them).
#
# `accepted` is the whole list of licences a dependency of the game may have. Each is permissive and compatible with
# distributing the game under GPL-3.0-only. A dependency whose licence expression cannot be satisfied from this list (a
# crate with a new licence, or an unknown one) stops the build of the bundle: read its licence, and add it here only if
# it too is compatible. For an expression with a choice (MIT OR Apache-2.0), one accepted alternative is enough, and the
# bundle carries that one (the first accepted; the crate's whole expression is printed beside it).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    # The project's own crates (hotdog-simulator, kitchen-sim, hotdog-server, hotdog-launcher, kitchen-ffi) are in the
    # dependency graph and are GPL-3.0-only. tools/licenses/render.py leaves them out of the bundle, and refuses a
    # GPL-3.0-only crate that is not one of them.
    "GPL-3.0-only",
]

# What the packages carry: build scripts and tests are not linked into any program, so only the other dependencies count.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Every platform a package is built for (README.md, "Building and packaging"): the Linux, Windows and macOS programs
# and the two browser builds. A crate only another platform needs (Android's, say) is left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnullvm",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
